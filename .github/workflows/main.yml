name: Deploy to Production

on:
  workflow_dispatch:  # Manually trigger the workflow.

permissions:
  id-token: write  # Required for accessing environments.
  contents: read  # Standard permissions for accessing repo content.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Tests
        run: echo "Running tests..."

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production  # Matches the environment name configured in GitHub settings.
      url: https://your-production-url.com  # Optional, sets an environment-specific URL.
    steps:
      - name: Deploy to Production
        run: echo "Deploying to Production..."

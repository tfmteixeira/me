name: Deployment Pipeline

on:
  push:
    branches:
      - main

permissions:
  issues: write  # Required for creating and managing the approval issue.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Tests
        run: echo "Running tests..."

  manual-approval:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}  # Use the GitHub token to authenticate.
          approvers: tfmteixeira  # Replace with actual GitHub usernames or organization team names.
          minimum-approvals: 1
          issue-title: "Approval Required for Deployment"
          issue-body: |
            Deployment is pending approval. Please review the changes and approve or deny.

  deploy:
    runs-on: ubuntu-latest
    needs: manual-approval
    steps:
      - name: Deploy to Production
        run: echo "Deploying application to production..."
